name: Deploy to Cloudways

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to Cloudways via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CLOUDWAYS_FTP_HOST }}
          username: ${{ secrets.CLOUDWAYS_FTP_USERNAME }}
          password: ${{ secrets.CLOUDWAYS_FTP_PASSWORD }}
          local-dir: dist/
          server-dir: ${{ secrets.CLOUDWAYS_APP_PATH }}
