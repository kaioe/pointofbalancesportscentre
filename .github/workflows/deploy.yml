name: Deploy to Cloudways

on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to Cloudways via SFTP (lftp mirror)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -u "${{ secrets.CLOUDWAYS_FTP_USERNAME }}","${{ secrets.CLOUDWAYS_FTP_PASSWORD }}" \
            -e "set sftp:auto-confirm yes; set net:timeout 30; \
            mirror -R --delete --verbose ${{ github.workspace }}/dist/ ${{ secrets.CLOUDWAYS_APP_PATH }}; \
            bye" \
            sftp://${{ secrets.CLOUDWAYS_FTP_HOST }}
