name: Deploy to Cloudways

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Deploy to Cloudways via Rsync
        run: |
          sshpass -p "${{ secrets.CLOUDWAYS_FTP_PASSWORD }}" rsync -vrtz --delete \
            --no-perms --no-owner --no-group --omit-dir-times \
            -e "ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10" \
            dist/ \
            ${{ secrets.CLOUDWAYS_FTP_USERNAME }}@${{ secrets.CLOUDWAYS_FTP_HOST }}:${{ secrets.CLOUDWAYS_APP_PATH }}
