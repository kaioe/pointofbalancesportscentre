name: Deploy to Cloudways

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to Cloudways via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.CLOUDWAYS_FTP_USERNAME }}
          server: ${{ secrets.CLOUDWAYS_FTP_HOST }}
          port: 22
          password: ${{ secrets.CLOUDWAYS_FTP_PASSWORD }}
          local_path: dist/*
          remote_path: ${{ secrets.CLOUDWAYS_APP_PATH }}
          sftp_only: true
